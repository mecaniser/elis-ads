# Pinned Ubuntu image, downloaded and digest-verified by Lima.
vmType: qemu
arch: x86_64
cpus: 4
memory: 4GiB
disk: 40GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:6a81c37564db9b1ee84e141922625e1d7c5b389b99bb3c572e0243607d5bb4d2
mounts: []
ssh:
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
portForwards:
  - guestIP: 0.0.0.0
    proto: any
    guestPortRange: [1, 65535]
    ignore: true
containerd:
  user: false
  system: false

# Avoid per-boot host-resolver DNAT into a private address blocked by isolation.
hostResolver:
  enabled: false
dns: [1.1.1.1, 8.8.8.8]
