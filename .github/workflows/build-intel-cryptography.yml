name: Build verified Intel Cryptography wheel

on:
  workflow_dispatch:
  push:
    branches: [codex/ads-dependency-security]
    paths:
      - .github/workflows/build-intel-cryptography.yml
      - scripts/build_intel_cryptography.py
      - control-plane/vendor/intel-build-tools.lock

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes --only-binary=:all: -r control-plane/vendor/intel-build-tools.lock
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build and verify pinned sources
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: python scripts/build_intel_cryptography.py
      - name: Upload wheel and build evidence for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intel-cryptography-50.0.2
          path: intel-wheel-output/
          if-no-files-found: error
          retention-days: 7
